        obstacle_z_min: -1.0 # 障碍物的z最小值(livox坐标系)
        obstacle_z_max: 0.02 # 障碍物的z最大值(livox坐标系)
        obstacle_range_min: 0.12 # 障碍物的最近距离(livox坐标系)
        obstacle_range_max: 15.0 # 障碍物的最远距离(livox坐标系)
        cluster_tolerance: 0.1 # 聚类距离阈值
        min_cluster_size: 100 # 最小聚类大小
        max_cluster_size: 25000 # 最大聚类大小

