                plugin: "nav2_costmap_2d::DenoiseLayer"
                enabled: True
                minimal_group_size: 2 # 最小组大小，小于此值的障碍物组将被过滤
                group_connectivity_type: 8 # 像素连接类型：4（水平垂直）或8（水平垂直对角线）
            always_send_full_costmap: True # 是否每次更新都发送完整的成本图，而不是更新

#minco规划器
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["MincoPlanner"]

    MincoPlanner:
      plugin: "minco_planner/MincoPlanner"
      planner_mode: PRIORMAP
      # planner_mode: EXPLORATION
      frames:
        map_frame: map
        rog_frame: map
      priormap:
        use_nav2_global_search: true
        clip_seed_by_rog_boundary: true
        rog_boundary_margin: 0.2
        rog_boundary_sample_step: 0.1
      exploration:
        boundary_margin: 0.2
        boundary_sample_step: 0.1
        unknown_as_occupied: true
        prefer_goal_direction: true
      tolerance: 0.3  
      use_smac: true
      allow_unknown: false
      odom_topic: /Odometry
      lidar_offset_x: 0.0
      lidar_offset_y: -0.20
      performance:
        enable: false
        print_enable: false
        detailed_csv_enable: false
        odom_sub_debug_enable: false
        minco_csv_path: /tmp/minco_perf_detailed.csv
        print_period_sec: 1.0
        csv_flush_every_n: 30
        run_id: ""
        scenario: ""
        variant: ""
      rog_map:
        frame_id: map
        resolution: 0.05
        # [基础地图][m/cell] 三维膨胀地图分辨率；通常与 resolution 保持一致，过细增加膨胀查询计算量，过粗会让碰撞边界变粗糙。
        inflation_resolution: 0.05
        map_size: [10.0, 10.0, 1.5]
        fix_map_origin: [0.0, 0.0, 0.0]

        map_sliding:
          enable: true
          # [map_sliding][m] 触发地图滑动的位移阈值；过小会频繁滑动并带来计算抖动，过大可能让机器人靠近局部地图边缘。
          threshold: 0.2
          center_offset_enable: true
          center_offset: [0.0, 0.20, 0.0]

        ros_callback:
          enable: true
          cloud_topic: /cloud_obstacle
          odom_topic: /Odometry
          odom_timeout: 2.0
          update_period_ms: 20

        # 入图前点云区域滤除；关闭时不创建过滤器，保持原始 ROGMap 数据链路。
        cloud_filter:
          enable: false
          z_offset: -1.0
          position_frame: map
          filter_mode: transform_center   # transform_cloud | transform_center
          remove_inside: true             # true: 删除框内点，false: 仅保留框内点
          log_stats: false
          stats_log_period_ms: 1000        # 0: 每帧输出
          publish_visualization: true
          visualization_topic: /cloud_registered_crop_filter/markers
          visualization_period_ms: 200     # 0: 每帧发布
          z_plane_size: 10.0
          z_plane_thickness: 0.03
          box_padding: 0.1
          # positions.* 未配置或长度不一致时使用单框参数。
          position:
            x: 0.0
            y: 0.0
            z: 0.0
          box_size:
            x: 12.0
            y: 6.0
            z: 3.5
          positions:
            x: [15.6, 19.3, 13.4, 9.9]
            y: [1.55, 12.9, 13.45, 2.1]
            z: [0.2, 0.4, 0.2, 0.4]
          box_sizes:
            x: [0.8, 0.7, 0.8, 0.7]
            y: [0.6, 0.4, 0.6, 0.4]
            z: [0.1, 0.1, 0.1, 0.1]

        raycasting:
          enable: true
          # [raycasting][帧] 每批处理点云帧数；调大可攒批减少调度开销，但会增加地图更新延迟。
          batch_update_size: 1
          # [raycasting][m,m] 射线有效距离 [min,max]；min 过大会忽略近处点，max 过大会增加计算量并可能引入远处噪声。
          ray_range: [0.03, 10.0]
          # [raycasting][m,m,m] 每次局部更新盒尺寸；调大覆盖更多点但 raycasting 和 dirty column 数量上升。
          local_update_box: [10.0, 10.0, 2.5]
          # [raycasting][概率] unknown 判断阈值相关参数；影响 UNKNOWN/FREE/OCCUPIED 判定，进而影响 projection layer。
          unk_thresh: 0.70
          p_hit: 0.9
          p_miss: 0.45
          p_min: 0.12
          p_max: 0.97
          p_occ: 0.85
          p_free: 0.499
          # [raycasting/performance][bool] raycast 并行开关；会被 performance.parallel_raycast_enable 后加载覆盖，影响 CPU 占用和更新延迟。
          parallel_enable: false
          # [raycasting/performance][线程] raycast 线程数；不宜超过可用 CPU 核数，过大可能因竞争导致抖动。
          num_threads: 4

        decay:
          enable: true
          # [decay][s] 最后一次 hit 后保持 occupied 的最小时间；过短障碍闪烁，过长动态障碍残留。
          keep_time: 0.5
          # [decay][s] 最后一次 hit 后强制衰减到 free 的最大时间；必须大于 keep_time。
          clear_time: 1.2
          # [decay][bool] 只维护活跃 cell 衰减列表；开启通常降低计算量，若列表维护异常会影响动态清除完整性。
          active_list_enable: false

        projection:
          enable: true

          # 标准 Nav2 YAML/PGM 静态先验；启用后只增加二维硬障碍，不清除在线障碍。
          prior_map:
            enable: false
            # yaml_path: "src/navigation/navi2_bringup/maps/2026/rmuc2026_prior.yaml"
            yaml_path: "src/auto_sentry2025/robot_bring_up/maps/2026_09_04_23_52_07_1.yaml"
            # 留空时使用 YAML 的 image 字段，并相对 YAML 所在目录解析。
            pgm_path: ""
            frame_id: map

          # [absolute Z coordinate, m]
          # ROGMap frame 中参与单柱扫描的绝对 Z 下界。
          # 这是坐标值，不是地面相对高度，也不是高度差。
          scan_z_min_abs: -0.20

          # [absolute Z coordinate, m]
          # ROGMap frame 中参与单柱扫描的绝对 Z 上界。
          # 这是坐标值，不是障碍高度，也不是高度差。
          scan_z_max_abs: 1.5

          # UNKNOWN 是否作为 ESDF 障碍。
          unknown_as_occupied: false

          # 每个 XY 柱中 KNOWN_FREE + OCCUPIED 的最小观测体素数。
          min_observed_voxels: 2

          # [vertical height difference, m]
          # 同一 XY 柱中最高与最低占据体素的垂直高度差 H。
          # 不超过该值时，分类为地面或坡面薄表面。
          # 这是差值，不是 ROGMap frame 中的绝对 Z 坐标。
          surface_height_delta_max: 0.25

          # [vertical height difference, m]
          # 判定竖直墙所需的最小单柱垂直高度差 H。
          # 这是差值，不是绝对 Z 坐标。
          wall_height_delta_min: 0.50

          # [dimensionless ratio, 0~1]
          # H 区间内的垂直占据率达到该值时，视为连续竖直墙。
          wall_occupancy_ratio_min: 0.80

          # [vertical height difference, m]
          # 可通行隧道所需的最小上下表面高度差。
          # 应包含机器人实际高度和安全余量。
          # 这是差值，不是绝对 Z 坐标。
          tunnel_height_delta_min: 0.26

          # [vertical height difference, m]
          # 当前 RM 场景中允许识别为目标隧道的最大上下表面高度差。
          # 这是差值，不是绝对 Z 坐标。
          tunnel_height_delta_max: 0.6

          # [dimensionless ratio, 0~1]
          # 隧道上下表面之间的最大垂直占据率。
          tunnel_occupancy_ratio_max: 0.6

          # PASSABLE 在 value layer 中的代价值。
          passable_cost: 50

          # PASSABLE 是否在 value layer 中写为 FREE。
          # PASSABLE 的 ESDF mask 始终为 1。
          passable_as_free: true

          hysteresis_enable: false
          hysteresis_count: 2
          # Projection 二维障碍退出原始 OCCUPIED 后的保持时间，单位为秒。
          obstacle_hold_time: 1.5

          mask_filter_en: true
          fill_occ_min: 8
          denoise_occ_max: 0
        field:
          enable: true
          inflation_radius: 0.0
          # [field][m] ESDF 正向最大截断距离；调大提供更远梯度但代价有限，过小会让远离障碍区域梯度变少。
          max_distance: 6.0
          # [field][m] ESDF 负向最小截断距离；控制障碍内部负距离下限，影响优化代价范围。
          min_distance: -3.0
          clamp_distance: true
          # [field][枚举] 插值方式 bilinear/quadratic；quadratic 梯度更平滑，边界邻域不足时会回退到 bilinear。
          interpolation: quadratic
          update_rate: 20.0

        performance:
          enable: false
          detailed_csv_enable: false
          summary_csv_enable: false
          detailed_csv_path: /tmp/rog_map_perf_detailed.csv
          summary_csv_path: /tmp/rog_map_perf_summary.csv
          run_id: ""
          # [performance][string] 实验场景名。
          scenario: ""
          # [performance][string] 实验变体名。
          variant: ""
          # [performance][行] CSV flush 间隔；避免每行强制 flush 变成新瓶颈，节点退出时仍会关闭文件。
          csv_flush_every_n: 30
          print_enable: true
          # [performance][Hz] 性能摘要和 summary CSV 频率。
          summary_rate: 1.0
          # [performance][bool] 是否启用 dirty column 增量刷新；开启可减少 projection/field 全量刷新计算量。
          dirty_column_enable: true
          # [performance][比例] dirty column 超过地图总列数比例时转全量刷新；调低更常全量，调高更依赖增量更新。
          dirty_full_ratio: 0.30
          # [performance/raycasting][bool] 并行 raycast 开关；代码后加载该值，会覆盖 raycasting.parallel_enable。
          parallel_raycast_enable: false
          raycast_num_threads: 4

        visualization:
          # [visualization][bool] 总开关；false 时不创建可视化 timer，不发布任何可视化 topic。
          enable: true
          frame_id: map
          # [visualization][Hz] 可视化发布上限频率；实际每个 topic 仅在存在订阅者时构造并发布。
          rate: 10.0
          range: [10.0, 10.0, 1.5]
      corridor:
        robot_radius: 0.25
        extra_margin: 0.05

      smac_2d:
        use_esdf_cost: true
        esdf_weight: 1.0
        esdf_decay: 0.8
        esdf_max_cost: 0.5

      minco_optimizer:
        opt_freq: 20.0
        traj_goal_tolerance: 0.3
        enable_yaw_opt: true
        safe_dist: 0.35
        collision_dist: 0.2
        lookahead_dist: 6.0  # 前视距离,用于minco部分优化
        max_velocity: 3.0
        max_acceleration: 2.0
        max_yaw_dot: 5.0
        turn_angle_deadzone: 0.1
        turn_angle_saturation: 0.8
        min_turn_vel: 0.7
        decay_power: 1.6
        time_allocation_iters: 15
        smooth_eps: 0.01
        integral_res: 16
        opt_accuracy: 0.001
        print_optimizer_log: false
        penalty_weight_time: 100.0
        penalty_weight_pos: 50000.0
        penalty_weight_vel: 1500.0
        penalty_weight_acc: 1500.0
        penalty_weight_att: 100.0
        penalty_weight_time_barrier: 50.0
      recovery_server:
        fail_threshold: 5
        cooldown_sec: 1.0
        recovery_window_sec: 3.0
        escape_speed: 0.5

smoother_server:
    ros__parameters:
        smoother_plugins: ["simple_smoother"]
        simple_smoother:
            plugin: "nav2_smoother::SimpleSmoother"
            tolerance: 1.0e-10
            max_its: 1000
            do_refinement: True

behavior_server:
    ros__parameters:
        point_topic: "/cloud_obstacle"
        cycle_frequency: 50.0
        behavior_plugins: ["keep_away_from_obstacles"]
        robot_radius: 0.3
        keep_away_from_obstacles:
            plugin: "nav2_behaviors/KeepAwayFromObstacles"
        global_frame: map
        robot_base_frame: lidar_base_link
        transform_tolerance: 0.1

waypoint_follower:
    ros__parameters:
        loop_rate: 50
        stop_on_failure: false
        waypoint_task_executor_plugin: "wait_at_waypoint"
        wait_at_waypoint:
            plugin: "nav2_waypoint_follower::WaitAtWaypoint"
            enabled: True
            waypoint_pause_duration: 200

velocity_smoother:
    ros__parameters:
        enabled: False
        smoothing_frequency: 50.0
        scale_velocities: True
        feedback: "OPEN_LOOP"
        max_velocity: [30.0, 30.0, 30.0]
        min_velocity: [-30.0, -30.0, -30.0]
        max_accel: [10.0, 10.0, 200.0]
        max_decel: [-10.0, -10.0, -200.0]
        odom_topic: "/Odometry"
        odom_duration: 0.02
        deadband_velocity: [0.0, 0.0, 0.0]
        velocity_timeout: 1.0


point_cloud_registration_node:
    ros__parameters:
        use_sim_time: true
        global_frame_id: map
        odom_frame_id: aligned_map
        registration_method: "NDT_OMP" # "NDT"或"GICP"或"NDT_OMP"或"GICP_OMP"
        point_topic: "/cloud_registered_body" # 订阅点云的话题，如果点云不在odom坐标系下，会进行坐标变换，如果点云在odom坐标系下，不进行坐标变换
        transform_epsilon: 0.01 # 变换中的小量用于停止匹配迭代
        stamp_epsilon: 0.1 # tf变换和点云时间戳之间的最大差异，单位为秒，超过此值的点云将被丢弃，不进行匹配
        # score_threshold: 2.0 # 分数阈值
        ndt_resolution: 1.0 # NDT分辨率
        ndt_step_size: 0.2 # NDT步长
        ndt_num_threads: 0 # NDT线程数 0为使用最大允许线程数
        use_voxel_grid_filter: false # 是否使用点云下采样，即使为false，ICP算法也会在读取pcd时进行下采样，只是不会在订阅点云时进行下采样
        voxel_leaf_size: 0.1 # 输入点云的下采样大小
        pcd_path: "/home/tc/Desktop/auto_sentry2025/src/auto_sentry2025/Point-LIO/PCD/RMUC/2025_05_18_23_54_52_merged.pcd"
        initial_trans: [0.0, 0.0, 0.0] # 初始位姿
        initial_rot: [0.0, 0.0, 0.0, 1.0] # 初始四元数
        scan_range:
            min_x: -100.0
            max_x: 100.0
            min_y: -100.0
            max_y: 100.0
            min_z: -100.0
            max_z: 100.0
