        point_num_for_normal: 10 # 用于计算法向量的点的数量
        angle_threshold: 0.785 # 法向量与地面夹角的角度阈值(绝对值、弧度制)
        obstacle_x_min: -10.0 # 障碍物的x最小值(livox坐标系)
        obstacle_x_max: 10.0 # 障碍物的x最大值(livox坐标系)
        obstacle_y_min: -10.0 # 障碍物的y最小值(livox坐标系)
