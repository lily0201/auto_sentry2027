# ROG-Map Simple Node Configuration
# 仅包含节点实际读取的参数（见 rog_map_simple_node.cpp 构造函数）

/**:
  ros__parameters:
    # === 输入/输出话题 ===
    cloud_topic: "/cloud_registered"              # Point-LIO 世界系点云(frame=map)，节点不再做坐标变换
    odom_topic: "/Odometry"                       # Point-LIO 里程计
    output_grid_topic: "/rog_map/occupancy_grid"  # 发布的2D栅格
    frame_id: "map"
    publish_rate: 10.0                            # Hz

    # === 3D 地图 ===
    map_resolution: 0.1                           # m
    map_half_size_x: 6.0                          # 需 > grid_half_size + map_sliding_threshold
    map_half_size_y: 6.0
    map_half_size_z: 1.5
    virtual_ground_height: -1.2                   # 世界系z；雷达离地约0.5m，需低于地面
    virtual_ceil_height: 1.5
    map_sliding_threshold: 0.5                    # 机器人偏离地图中心超过该值才滑动
    raycast_range_max: 8.0

    # === 2D 栅格投影 ===
    grid_half_size: 5.0                           # 发布 10m x 10m；超过地图允许范围会被截断
    proj_z_min: -0.35                             # 相对雷达；地面约在 -0.5，留 0.15 余量避免地面点
    proj_z_max: 0.02 