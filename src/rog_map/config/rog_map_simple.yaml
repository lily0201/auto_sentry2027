# ROG-Map Simple Node Configuration
# 仅包含节点实际读取的参数（见 rog_map_simple_node.cpp 构造函数）

/**:
  ros__parameters:
    # === 输入/输出话题 ===
    cloud_topic: "/cloud_registered"              # Point-LIO 世界系点云(frame=map)，节点不再做坐标变换
    odom_topic: "/Odometry"                       # Point-LIO 里程计
    output_grid_topic: "/rog_map/occupancy_grid"  # 发布的2D栅格
    frame_id: "map"
    publish_rate: 10.0                            # Hz

    # === 3D 地图 ===
    map_resolution: 0.05                           # m
    map_half_size_x: 6.0                          # 需 > grid_half_size + map_sliding_threshold
    map_half_size_y: 6.0
    map_half_size_z: 1.5
    virtual_ground_height: -1.2                   # 世界系z；雷达离地约0.5m，需低于地面
    virtual_ceil_height: 1.5
    map_sliding_threshold: 0.5                    # 机器人偏离地图中心超过该值才滑动
    raycast_range_max: 8.0

    # === 2D 栅格投影 ===
    grid_half_size: 5.0                           # 发布 10m x 10m；超过地图允许范围会被截断
    proj_z_min: -0.23                             # 相对雷达；
    proj_z_max: 0.02                              # 相对雷达

    # === 障碍点云输出（供 Nav2 costmap / KeepAwayFromObstacles）===
    publish_obstacle_cloud: true
    obstacle_cloud_topic: "/rog_map/obstacle_cloud"
    obstacle_cloud_frame: "base_link"             # 必须与 costmap 的 robot_base_frame 一致
    obstacle_cloud_spacing: 0.05                  # 点间距，需等于 costmap 分辨率(0.05)，否则会被 denoise_layer 删掉
    obstacle_cloud_z: -0.2                        # 相对雷达；须在 costmap 的 [min,max]_obstacle_height(-2.0~0.02) 内

    # === 带高度的3D占据点云（仅可视化，无订阅者时不计算）===
    publish_cloud_3d: true
    cloud_3d_topic: "/rog_map/obstacle_cloud_3d"
    cloud_3d_z_min: -0.25                          # 相对雷达；须在 virtual_ground/ceil 之内
    cloud_3d_z_max: 1.2
